#
# File:      tools/openocd/connect-under-reset.cfg
# Brief:     Connects with the core held in reset, for flashing and for a debug launch.
# Element:   Nexus-Physical-01-04 (bootloader)
# Decisions: SW-04
#
# Loaded after fbl.cfg. Whatever runs on the chip can sleep or take the SWD pins: the image found on
# a new board did, and the plain connection failed ("unable to connect to the target"). Holding NRST
# while connecting works whatever the image does, so flashing and launching never depend on it.
#
# OpenOCD keeps NRST asserted after the connection until a reset command. A flash or a debug launch
# resets anyway; GDB's arrival does a reset halt, so it finds a halted core and not one in reset.
# Attach must not load this file: it would reset the core it means to look at.

reset_config srst_only srst_nogate connect_assert_srst

$_TARGETNAME configure -event gdb-attach { reset halt }
