#
# File:      tools/openocd/fbl.cfg
# Brief:     OpenOCD configuration for the NUCLEO-H533RE through its on-board STLINK-V3EC.
# Element:   Nexus-Physical-01-04 (bootloader)
# Decisions: SW-04, HW-22
#
# The ST-LINK path: the first FBL goes on with it and it stays the recovery path (SW-04, T1.2).
# This file connects to a running core without resetting it: Attach in .vscode/launch.json uses it
# alone. Flashing and a debug launch add connect-under-reset.cfg after it. On the command line:
#   openocd -f tools/openocd/fbl.cfg -f tools/openocd/connect-under-reset.cfg \
#           -c "program build/output/FBL_Nexus.srec verify reset exit"
# program erases only the sectors the image covers, never the whole chip (SW-04).
# The flash is in 8 KB sectors (CFG and NvM sit above the application and are not touched).

# Needs ST's OpenOCD fork: the stock 0.12.0 has no STM32H5 target (tools/README.md).
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32h5x.cfg]

# NRST is wired from the STLINK-V3EC to the MCU (UM3121, MB1814 schematic).
# srst_nogate: the SWD clock keeps running while NRST is low.
reset_config srst_only srst_nogate
